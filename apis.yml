- aid: qwiet:qwiet-rbac-api
  name: Qwiet rbac API
  description: >-
    Roles-based access control (RBAC) allows you to control the permissions users in an organization are
    granted.


    The permissions granted to a user are additive. The base level of a user's permission is determined
    by their role in the organization.


    A team represents a group of users and the applications that group of users can access. Users are
    granted additional permissions based on their team role.


    Users can belong to multiple teams, but an application can only belong to one team.


    You can use the `TEAM_DEFINED` organization role to limit user access to only the apps assigned to
    their team.


    [![Run in Postman](https://run.pstmn.io/button.svg)](https://god.gw.postman.com/run-collection/9829310-c002d05e-2fae-4914-8629-54cff59e1e6b?action=collection%2Ffork&collection-url=entityId%3D9829310-c002d05e-2fae-4914-8629-54cff59e1e6b%26entityType%3Dcollection%26workspaceId%3Da63f69cc-5c31-4f2b-8d28-b647f83b9e97)
