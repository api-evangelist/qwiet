aid: qwiet
name: Qwiet
description: >-
  Qwiet AI (formerly ShiftLeft, now part of Harness) is an application security
  testing platform delivering SAST, SCA, IaC, container, and secrets scanning in
  a single scan, with reachability and exploitability filtering to cut false
  positives and AI-generated code fixes (AutoFix) to speed remediation. The
  Qwiet API (OpenAPI 3.0.0, v4, Bearer-token auth) lets you programmatically
  manage applications, run and compare scans, retrieve and triage findings with
  data flow, request fixes, manage users and RBAC, and configure alerting
  webhooks. Qwiet also ships an official MCP server and a set of agent skills
  for the scan-triage-autofix workflow, plus the `sl` CLI.
